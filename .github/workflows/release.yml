name: Release and Publish

on:
  push:
    branches: [release]

env:
  HUSKY: 0

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      root_changed: ${{ steps.changes.outputs.root_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect package changes
        id: changes
        run: |
          BEFORE_SHA="${{ github.event.before }}"
          AFTER_SHA="${{ github.sha }}"

          # On a new branch or force-push the "before" SHA can be all zeros or
          # missing. Fall back to the previous commit so the diff still works.
          if [ -z "$BEFORE_SHA" ] \
            || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            if git rev-parse --verify --quiet "${AFTER_SHA}~1" >/dev/null; then
              BEFORE_SHA=$(git rev-parse "${AFTER_SHA}~1")
              echo "No valid before SHA; falling back to parent commit $BEFORE_SHA"
            else
              # Root commit (no parent) — diff against the empty tree so the
              # initial commit's files are all detected as changes.
              BEFORE_SHA=$(git hash-object -t tree /dev/null)
              echo "Root commit detected; diffing against empty tree $BEFORE_SHA"
            fi
          fi

          echo "Comparing $BEFORE_SHA..$AFTER_SHA"
          CHANGED_FILES=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")
          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Root package = anything outside .github/
          ROOT_CHANGES=$(echo "$CHANGED_FILES" | grep -v "^\.github/" || true)
          if [ -n "$ROOT_CHANGES" ]; then
            echo "root_changed=true" >> "$GITHUB_OUTPUT"
            echo "Root package has changes:"
            echo "$ROOT_CHANGES"
          else
            echo "root_changed=false" >> "$GITHUB_OUTPUT"
            echo "No root package changes detected"
          fi

  release:
    needs: detect-changes
    if: needs.detect-changes.outputs.root_changed == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      pull-requests: write
      id-token: write

    environment: npm

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - name: Install dependencies
        run: pnpm install

      - name: Run linting
        run: pnpm lint

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get latest commit info
        id: commit-info
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          echo "message=$COMMIT_MSG" >> $GITHUB_OUTPUT

          # Determine semantic version bump based on commit message
          if [[ "$COMMIT_MSG" =~ ^feat(\(.+\))?!: ]] || [[ "$COMMIT_MSG" =~ BREAKING[[:space:]]CHANGE ]]; then
            echo "bump=major" >> $GITHUB_OUTPUT
            echo "Detected BREAKING CHANGE - will perform major version bump"
          elif [[ "$COMMIT_MSG" =~ ^feat(\(.+\))?: ]]; then
            echo "bump=minor" >> $GITHUB_OUTPUT
            echo "Detected feature commit - will perform minor version bump"
          elif [[ "$COMMIT_MSG" =~ ^fix(\(.+\))?: ]] || [[ "$COMMIT_MSG" =~ ^perf(\(.+\))?: ]]; then
            echo "bump=patch" >> $GITHUB_OUTPUT
            echo "Detected fix/perf commit - will perform patch version bump"
          else
            echo "bump=patch" >> $GITHUB_OUTPUT
            echo "No specific commit type detected - defaulting to patch version bump"
          fi

      - name: Bump version
        id: version-bump
        run: |
          BUMP_TYPE="${{ steps.commit-info.outputs.bump }}"
          echo "Bumping version with type: $BUMP_TYPE"

          NEW_VERSION=$(pnpm version $BUMP_TYPE --no-git-tag-version)
          NEW_VERSION=$(echo $NEW_VERSION | sed 's/^v//')
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Version bumped to: $NEW_VERSION"

      - name: Build project
        run: |
          echo "Building project with new version..."
          pnpm run build

      - name: Check if version already published
        id: version-check
        run: |
          NEW_VERSION="${{ steps.version-bump.outputs.new_version }}"
          PACKAGE_NAME=$(node -p "require('./package.json').name")

          echo "Checking if $PACKAGE_NAME@$NEW_VERSION is already published..."

          # Check if version exists on NPM
          if npm view "$PACKAGE_NAME@$NEW_VERSION" version 2>/dev/null; then
            echo "Version $NEW_VERSION is already published on NPM"
            echo "already_published=true" >> $GITHUB_OUTPUT
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "Version $NEW_VERSION is not published yet"
            echo "already_published=false" >> $GITHUB_OUTPUT
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish to NPM
        id: npm-publish
        if: steps.version-check.outputs.should_publish == 'true'
        run: |
          echo "Publishing to NPM..."
          npm publish --access public
          echo "NPM publish successful!"
          echo "publish_success=true" >> $GITHUB_OUTPUT

      - name: Skip publish (already exists)
        id: skip-publish
        if: steps.version-check.outputs.already_published == 'true'
        run: |
          NEW_VERSION="${{ steps.version-bump.outputs.new_version }}"
          echo "Skipping NPM publish - version $NEW_VERSION already exists"
          echo "Setting publish_success=true for already published version"
          echo "publish_success=true" >> $GITHUB_OUTPUT

      - name: Commit and tag release
        if: steps.npm-publish.outputs.publish_success == 'true' || steps.skip-publish.outputs.publish_success == 'true'
        run: |
          NEW_VERSION="${{ steps.version-bump.outputs.new_version }}"
          BUMP_TYPE="${{ steps.commit-info.outputs.bump }}"

          git add package.json
          git commit -m "chore(release): $NEW_VERSION"

          # Create and push tag
          git tag -a "$NEW_VERSION" -m "Release $NEW_VERSION"
          git push origin release
          git push origin --tags

          echo "Released version $NEW_VERSION with $BUMP_TYPE bump"

      - name: Rollback on publish failure
        if: failure() && steps.npm-publish.conclusion == 'failure'
        run: |
          echo "NPM publish failed, rolling back version change..."
          git checkout -- package.json
          echo "Version rollback completed"
